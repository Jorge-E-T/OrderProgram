<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install on rabbit r1 · La Casa Ordering</title>
    <style>
        :root { --primary: #2563eb; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --bg: #f3f5f8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 2rem 1rem; }
        .card { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
        h1 { font-size: 1.3rem; margin-bottom: .25rem; }
        p { color: var(--muted); line-height: 1.5; margin-bottom: 1rem; font-size: .95rem; }
        ol { margin: 0 0 1.25rem 1.2rem; line-height: 1.7; font-size: .95rem; }
        label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: .3rem; }
        input { width: 100%; height: 38px; border: 1px solid #cbd5e1; border-radius: 7px; padding: 0 .7rem; font: inherit; margin-bottom: .9rem; }
        .row { display: grid; grid-template-columns: 1fr auto; gap: .75rem; }
        button { white-space: nowrap; height: 38px; padding: 0 1rem; border-radius: 7px; border: 1px solid var(--primary); background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        #qr { display: flex; justify-content: center; padding: 1rem; background: #fff; border: 1px dashed #cbd5e1; border-radius: 10px; margin: .5rem 0 1rem; min-height: 290px; align-items: center; }
        code { display: block; font-size: .75rem; background: #f8fafc; border: 1px solid var(--border); border-radius: 7px; padding: .6rem; word-break: break-all; color: #334155; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Install on your rabbit r1</h1>
        <p>Open this page on a computer or phone, then scan the code with your r1.</p>
        <ol>
            <li>On the r1, open <b>creations</b> and choose <b>add via QR code</b>.</li>
            <li>Point the r1 camera at the code below.</li>
            <li>Open the new creation. The first start loads your inventory, which can take a minute.</li>
        </ol>

        <label for="url">Program address (filled in automatically)</label>
        <input id="url">
        <div class="row">
            <div>
                <label for="ver">Version (raise it after you update the files)</label>
                <input id="ver" type="number" min="1" value="2">
            </div>
            <div style="padding-top:1.2rem;"><button onclick="draw()">Update code</button></div>
        </div>

        <div id="qr"></div>
        <label>What the code contains</label>
        <code id="payload"></code>
    </div>

    <!-- QR code library (qrcode-generator 1.4.4, MIT license), kept in the repo so it works offline -->
    <script src="qrcode.js"></script>
    <script>
        // The program lives in the same folder as this page: .../index.html
        const base = location.href.replace(/install\.html.*$/, '');
        document.getElementById('url').value = base + 'index.html';

        function draw() {
            const url = document.getElementById('url').value.trim();
            const v = document.getElementById('ver').value || '1';
            const fullUrl = url + (url.includes('?') ? '&' : '?') + 'v=' + v;   // the r1 caches by address
            const payload = {
                title: 'La Casa Orders',
                url: fullUrl,
                description: 'La Casa De Los Trucos ordering system',
                iconUrl: base + 'logo.png',
                themeColor: '#2563eb'
            };
            const text = JSON.stringify(payload);
            document.getElementById('payload').textContent = text;
            const qr = qrcode(0, 'M');      // 0 = pick the size automatically
            qr.addData(text);
            qr.make();
            document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 5, margin: 4, scalable: true });
            document.querySelector('#qr svg').setAttribute('width', '270');
            document.querySelector('#qr svg').setAttribute('height', '270');
        }
        draw();
    </script>
</body>
</html>
